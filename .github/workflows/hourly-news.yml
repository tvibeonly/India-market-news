
name: Daily Indian Market News

on:
  schedule:
    # 02:30 UTC = 08:00 IST, once a day (GitHub may delay scheduled runs a bit)
    - cron: "30 2 * * *"
  workflow_dispatch:

# Needs write access so the run can commit seen_news.json (avoids repeated articles).
permissions:
  contents: write

concurrency:
  group: daily-indian-market-news
  cancel-in-progress: false

jobs:
  market-news:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install requests
          fi

      - name: Run market news script
        env:
          AI_PROVIDER: groq
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          # Optional repo variable: comma-separated Groq models, best first.
          GROQ_MODELS: ${{ vars.GROQ_MODELS }}
          # Sized to fit Groq's free-tier tokens-per-minute limit.
          AI_MAX_TOKENS: "3000"
          MAX_ARTICLES: "60"
          MAX_AI_ARTICLES: "15"
          AI_TIMEOUT: "120"
          REQUEST_TIMEOUT: "20"
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python market_news.py

      - name: Commit seen-news state
        run: |
          if ! git diff --quiet -- seen_news.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add seen_news.json
            git commit -m "Update seen news state"
            git push
          fi
