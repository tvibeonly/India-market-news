
name: Hourly Indian Market News

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hourly-indian-market-news
  cancel-in-progress: false

jobs:
  market-news:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install requests
          fi

      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama
        run: |
          ollama serve > /tmp/ollama.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then
              echo "Ollama is ready."
              exit 0
            fi
            sleep 2
          done
          echo "Ollama failed to start:"
          cat /tmp/ollama.log
          exit 1

      - name: Download AI model
        run: |
          ollama pull qwen2.5:3b

      - name: Test Ollama API
        run: |
          curl --fail --show-error --silent \
            http://127.0.0.1:11434/api/chat \
            -H "Content-Type: application/json" \
            -d '{
              "model": "qwen2.5:3b",
              "messages": [
                {
                  "role": "user",
                  "content": "Reply with exactly: AI working"
                }
              ],
              "stream": false
            }'

      - name: Run market news script
      env:
          AI_PROVIDER: ollama
          OLLAMA_MODEL: qwen2.5:3b
          OLLAMA_URL: http://127.0.0.1:11434/v1/chat/completions
          AI_MAX_TOKENS: "5000"
          AI_TIMEOUT: "300"
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python market_news.py
