name: Hourly Indian Market News

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

# Needs write access so the run can commit seen_news.json (avoids repeated articles).
permissions:
  contents: write

concurrency:
  group: hourly-indian-market-news
  cancel-in-progress: false

jobs:
  market-news:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install requests
          fi

      - name: Run market news script
        env:
          AI_PROVIDER: huggingface
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          # Optional repo variable: comma-separated model list, best first.
          # Leave unset to use the built-in chain in market_news.py.
          HF_MODELS: ${{ vars.HF_MODELS }}
          AI_MAX_TOKENS: "6000"
          MAX_ARTICLES: "60"
          MAX_AI_ARTICLES: "30"
          AI_TIMEOUT: "300"
          REQUEST_TIMEOUT: "20"
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python market_news.py

      - name: Commit seen-news state
        run: |
          if ! git diff --quiet -- seen_news.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add seen_news.json
            git commit -m "Update seen news state"
            git push
          fi
